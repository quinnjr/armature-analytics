[package]
name = "armature-analytics"
version = "0.2.3"
edition = "2024"
rust-version = "1.94.1"
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-analytics"
homepage = "https://quinnjr.github.io/armature"
description = "API analytics and usage tracking for Armature framework"
keywords = ["analytics", "metrics", "monitoring", "api", "observability"]
categories = ["web-programming", "development-tools::profiling"]

[dependencies]
armature-core = { version = "0.8" }
armature-log = { version = "0.2" }
tokio = { version = "1.52", features = ["rt-multi-thread", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
thiserror = "2.0"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.2"

[features]
default = []

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio-test = "0.4"

